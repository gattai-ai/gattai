name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gattai
          POSTGRES_PASSWORD: gattai
          POSTGRES_DB: gattai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gattai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://gattai:gattai@localhost:5432/gattai
      TEST_DATABASE_URL: postgres://gattai:gattai@localhost:5432/gattai_test
      # >=32 karakter: produksi menolak secret contoh/pendek (lihat env.ts).
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      SIWE_DOMAIN: localhost:3000
      # Origin frontend deterministik agar CORS + penjaga CSRF bisa diuji.
      FRONTEND_URL: http://localhost:5173
      # Route deposit menolak dengan 503 bila DEPOSIT_MANAGER_ADDRESS kosong,
      # jadi test butuh alamat valid (alamat testnet, tidak pernah dipakai sungguhan).
      DEPOSIT_MANAGER_ADDRESS: "0x31d02e01406bf31dF857fD65865E03d4dD5ab82a"
      DEPOSIT_TREASURY_ADDRESS: "0x3b113D111672F8cc2e060F028EF4fF0B886dE63E"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate disamakan dengan gate lokal (root script) supaya satu sumber kebenaran:
      # typecheck + lint mencakup frontend, backend, dan contracts.
      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Migrate database
        run: bun run --cwd backend db:migrate

      - name: Test (backend + frontend)
        run: bun run test

      - name: Build (frontend)
        run: bun run --cwd frontend build

      # Pipeline penuh (HTTP → auth → interpreter → orchestrator → provider →
      # billing) dengan provider mock; tidak butuh API key asli.
      - name: E2E offline (backend)
        run: bun run --cwd backend e2e:offline
